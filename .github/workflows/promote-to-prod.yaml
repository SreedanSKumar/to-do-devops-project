name: Promote Staging to Production

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Read current staging image tags
        id: current
        run: |
          # Extract ONLY the newTag from the staging kustomization file
          BACKEND_TAG=$(yq eval '.images[] | select(.name == "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend") | .newTag' k8s/overlays/staging/kustomization.yaml)
          FRONTEND_TAG=$(yq eval '.images[] | select(.name == "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend") | .newTag' k8s/overlays/staging/kustomization.yaml)
          
          # Fail the pipeline immediately if it can't find the tags, preventing cluster crashes
          if [ -z "$BACKEND_TAG" ] || [ -z "$FRONTEND_TAG" ]; then
            echo "Error: Could not extract image tags from staging overlay."
            exit 1
          fi

          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"

      - name: Point prod overlay at the staging tags
        working-directory: k8s/overlays/prod
        run: |
          # Inject the actual variables extracted from Staging, NOT the github.sha
          kustomize edit set image \
            "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend=866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend:${{ steps.current.outputs.backend_tag }}" \
            "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend=866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend:${{ steps.current.outputs.frontend_tag }}"

      - name: Commit prod promotion
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add k8s/overlays/prod/kustomization.yaml
          # Added [skip ci] so this commit doesn't accidentally trigger your main build pipeline again
          git commit -m "promote(prod): sync to staging tags ${{ steps.current.outputs.backend_tag }} [skip ci]" || echo "nothing to commit"
          git push