name: Promote Staging to Production

# Deliberately manual - this is the approval gate between "it's on staging"
# and "it's on prod". Run it from the Actions tab once you've checked staging.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Read current staging image tags
        id: current
        run: |
          BACKEND_IMAGE=$(yq eval '.images[] | select(.name | test("opsboard-backend")) | (.newName + ":" + .newTag)' k8s/overlays/staging/kustomization.yaml)
          FRONTEND_IMAGE=$(yq eval '.images[] | select(.name | test("opsboard-frontend")) | (.newName + ":" + .newTag)' k8s/overlays/staging/kustomization.yaml)
          echo "backend_image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Point prod overlay at the same images
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend=866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend:${{ github.sha }}" \
            "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend=866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend:${{ github.sha }}"

      - name: Commit prod promotion
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "promote(prod): ${{ steps.current.outputs.backend_image }}" || echo "nothing to commit"
          git push
