name: Promote Staging to Production

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Read current staging image tags
        id: current
        run: |
          # Extract the exact newTag values from Staging
          BACKEND_TAG=$(yq eval '.images[] | select(.name | test("opsboard-backend")) | .newTag' k8s/overlays/staging/kustomization.yaml)
          FRONTEND_TAG=$(yq eval '.images[] | select(.name | test("opsboard-frontend")) | .newTag' k8s/overlays/staging/kustomization.yaml)

          if [ -z "$BACKEND_TAG" ] || [ -z "$FRONTEND_TAG" ]; then
            echo "Error: Could not read image tags from staging kustomization.yaml"
            exit 1
          fi

          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"

      - name: Point prod overlay at the staging tags
        working-directory: k8s/overlays/prod
        run: |
          # Apply the extracted Staging tags, NOT github.sha
          kustomize edit set image \
            "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend=866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend:${{ steps.current.outputs.backend_tag }}" \
            "866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend=866567874348.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend:${{ steps.current.outputs.frontend_tag }}"

      - name: Commit prod promotion
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "promote(prod): sync to staging tags [skip ci]" || echo "nothing to commit"
          git push