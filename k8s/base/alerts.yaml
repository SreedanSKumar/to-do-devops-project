apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opsboard-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: opsboard.rules
      rules:
        - alert: OpsBoardBackendDown
          expr: up{job="backend"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "OpsBoard backend target is down"
            description: "Prometheus has not been able to scrape the backend /metrics endpoint for 2 minutes."

        - alert: OpsBoardHighErrorRate
          expr: |
            sum(rate(opsboard_backend_http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(opsboard_backend_http_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpsBoard backend 5xx rate above 5%"
            description: "More than 5% of backend requests have returned a 5xx status over the last 5 minutes."

        - alert: OpsBoardHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(opsboard_backend_http_request_duration_seconds_bucket[5m])) by (le)) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpsBoard backend p95 latency above 1s"
            description: "95th percentile request latency has been above 1 second for 5 minutes."

        - alert: OpsBoardPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{container=~"backend|frontend"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpsBoard pod restarting repeatedly"
            description: "{{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."
