# Loki + Promtail for log aggregation, feeding the same Grafana above.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.10.2"
    helm:
      valuesObject:
        loki:
          enabled: true
          persistence:
            enabled: false # demo-friendly; enable + set a size for real prod
        promtail:
          enabled: true
        grafana:
          enabled: false # already deployed by kube-prometheus-stack
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
