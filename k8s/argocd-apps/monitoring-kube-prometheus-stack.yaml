# Prometheus + Alertmanager + Grafana, deployed the same GitOps way as the
# app itself - ArgoCD watching a Helm chart instead of raw manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "61.3.2"
    helm:
      valuesObject:
        grafana:
          enabled: true
          adminPassword: change-me-in-a-real-deploy
          defaultDashboardsEnabled: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            ruleSelectorNilUsesHelmValues: false
            ruleSelector: {}
            ruleNamespaceSelector: {}
            retention: 7d
            resources:
              requests: { cpu: 200m, memory: 512Mi }
              limits: { cpu: 500m, memory: 1Gi }
        alertmanager:
          enabled: true
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'job']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: 'discord-alerts'
              routes:
                - match:
                    severity: critical
                  receiver: 'discord-alerts'
            receivers:
              - name: 'discord-alerts'
                discord_configs:
                  - webhook_url: 'https://discord.com/api/webhooks/1534516147624611881/dOYaPVITTRFMkPotAYjw3y9nkXzfCyW42l3hPltVJuK8eO8jKuVeWnYfkim9LouXHCTR'
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
                    message: "{{ range .Alerts }}**Description:** {{ .Annotations.description }}\n**Summary:** {{ .Annotations.summary }}\n{{ end }}"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true